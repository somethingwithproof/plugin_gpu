schema_version: 1
plugin: gpu
cacti_compat: ">=1.2.31"
php_compat: ">=8.2"
db_schema_version: 4

# Strict separation between declarative operator configuration (authored via
# CasC, replicated to remote pollers) and observed runtime state (written only
# by background collection, never authored via CasC).
config:
  secrets_stored: false
  casc_formats:
    - yaml
    - xml
  settings:
    table: settings
    fields:
      gpu_absent_after:
        type: integer
        minimum: 1
        maximum: 1440
        default: 3
        description: Consecutive successful collections missing a GPU before marking it absent.
      gpu_stale_after:
        type: integer
        minimum: 60
        maximum: 86400
        default: 600
        description: Sample age limit in seconds before script server returns U.
      gpu_uninstall_keep_tables:
        type: boolean
        default: true
        description: Preserve plugin tables across plugin uninstall when true.
      gpu_uninstall_remove_objects:
        type: boolean
        default: false
        description: Remove unused plugin templates and data query XML on uninstall when true.
  nodes:
    table: plugin_gpu_node
    replicated_to_remote_pollers: true
    primary_key: id
    unique_keys:
      - host_id
    fields:
      host_id:
        type: integer
        minimum: 1
        references: host.id
      admin_state:
        type: string
        enum:
          - enabled
          - disabled
        default: enabled

state:
  read_only_in_casc: true
  tables:
    plugin_gpu_gpu:
      purpose: GPU and MIG instance identity records keyed by (vendor, uuid).
      primary_key: id
      unique_keys:
        - [vendor, uuid]
      retention: never_deleted_by_collection
      mig_columns_v4:
        - mig_mode
        - mig_instance_id
        - mig_profile
        - parent_uuid
        - partition_info
    plugin_gpu_observation:
      purpose: Latest normalized GPU telemetry sample per gpu_id in model units.
      primary_key: gpu_id
      monotonic_guard: observed_at
    plugin_gpu_collection:
      purpose: Latest collection execution status per node_id (bounded detail, no raw tool output).
      primary_key: node_id
    plugin_gpu_reindex:
      purpose: Pending Cacti data query reindex queue per node_id with optimistic generation counter.
      primary_key: node_id
    plugin_gpu_retired:
      purpose: Operator-retired absent GPUs omitted from data query listings without deleting history.
      primary_key: gpu_id

integration:
  cross_plugin_php_imports: false
  hooks:
    - auth_alternate_realms
    - config_arrays
    - config_settings
    - draw_navigation_text
    - poller_bottom
    - device_remove
    - api_device_new
    - replicate_out
    - remote_agent
    - abilities_register
    - doctor_register_checks
    - doctor_register_debug_info
    - casc_register_providers
    - api_register_resources
  realms:
    - name: GPU View
      files:
        - gpu_inventory.php
        - gpu_health.php
    - name: GPU Operator
      files:
        - gpu_operator.php
    - name: GPU Admin
      files:
        - gpu_nodes.php
  api_resources:
    - gpu/nodes
    - gpu/devices
    - gpu/health
    - gpu/cluster-utilization
  abilities:
    - gpu-list-nodes
    - gpu-list-devices
    - gpu-get-health
  doctor_checks:
    - gpu_schema
    - gpu_collection_freshness
    - gpu_identity_anomalies
